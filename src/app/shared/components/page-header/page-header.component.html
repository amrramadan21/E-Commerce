<div class="bg-gradient-to-br from-primary-600 via-primary-500 to-primary-400 text-white">
  <div class="container mx-auto px-4 py-10 sm:py-14">
    <app-bread-crumbs [pageTitle]="title()" [breadCrumbs]="breadCrumbs()" />
    <div class="flex items-center gap-5 mt-3">
      <div
        class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-xl ring-1 ring-white/30 shrink-0"
      >
        <i [class]="icon() + ' text-2xl sm:text-3xl'"></i>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight">{{ title() }}</h1>
        @if (description()) {
          <p class="text-white/80 mt-1 text-sm sm:text-base">{{ description() }}</p>
        }
      </div>
    </div>
  </div>
</div>
