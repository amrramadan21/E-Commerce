<nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-white/70 flex-wrap">
  <a class="hover:text-white transition-colors" routerLink="/">Home</a>

  @for (crumb of breadCrumbs(); track $index) {
    <span class="text-white/40">/</span>
    <a [routerLink]="crumb.url" class="hover:text-white transition-colors">{{
      crumb.name
    }}</a>
  }

  @if (pageTitle()) {
    <span class="text-white/40">/</span>
    <span class="text-white font-medium">{{ pageTitle() }}</span>
  }
</nav>
