<section>
  <div class="container my-10 mx-auto">
    <div class="md:grid grid-cols-2 gap-10">
      <!-- Left column -->
      <div>
        <div class="hidden lg:block">
          <div class="text-center space-y-6">

              class="w-full h-96 object-cover rounded-2xl shadow-lg"

            />
            <div class="space-y-4">
              <h2 class="text-3xl font-bold text-gray-800">
                Reset Your Password
              </h2>

              </p>
              <div class="flex items-center justify-center space-x-8 text-sm text-gray-500">
                <div class="flex items-center gap-2">
                  <svg class="w-5 h-5 text-primary-600" viewBox="0 0 384 512" fill="currentColor">
                    <path d="M128 96l0 64 128 0 0-64c0-35.3-28.7-64-64-64s-64 28.7-64 64zM64 160l0-64C64 25.3 121.3-32 192-32S320 25.3 320 96l0 64c35.3 0 64 28.7 64 64l0 224c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 224c0-35.3 28.7-64 64-64z"/>
                  </svg>
                  Secure Process
                </div>
                <div class="flex items-center gap-2">
                  <svg class="w-5 h-5 text-primary-600" viewBox="0 0 512 512" fill="currentColor">
                    <path d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/>

                  Email Verification
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="w-full">
          <div class="bg-white rounded-2xl shadow-xl p-8 lg:p-12">
            <div class="text-center mb-8">
              <div class="flex items-center justify-center mb-4">
                <span class="text-3xl font-bold text-primary-600">Fresh<span class="text-gray-800">Cart</span></span>
              </div>
              <h1 class="text-2xl font-bold text-gray-800 mb-2">Forgot Password</h1>
              <p class="text-gray-600">Follow the steps to reset your password</p>
            </div>

            <app-forget-password-form />

            <div class="text-center mt-8 pt-6 border-t border-gray-100">
              <p class="text-gray-600">
                Remember your password?
                <a class="text-primary-600 hover:text-primary-700 ms-2 font-semibold" routerLink="/login">Sign In</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
